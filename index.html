<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Señaleros de plataforma · AURAV</title>
<style>
  :root { --tinta: #082440; --acento: #29b6f6; --chaleco: #c8e63a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ea; font-family: Arial, Helvetica, sans-serif; }
  [hidden] { display: none !important; }
  #lienzo { position: fixed; inset: 0; touch-action: none; }
  #barra { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap;
    background: linear-gradient(rgba(8,36,64,.8), rgba(8,36,64,0)); color: #fff; font-size: 15px; pointer-events: none; }
  #barra > * { pointer-events: auto; }
  #barra .sep { flex: 1; }
  #fase { color: var(--chaleco); font-weight: bold; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  #entrar-vr { background: var(--acento); color: var(--tinta); font-weight: bold; }
  .chico { background: rgba(255,255,255,.18); color: #fff; font-size: 13px; }
  .chico.activa { background: #fff; color: var(--tinta); }
  #cartel { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); background: rgba(8,36,64,.8); color: var(--chaleco);
    padding: 7px 16px; border-radius: 20px; font-size: 16px; font-weight: bold; white-space: nowrap; }
  #tutor { position: fixed; left: 12px; bottom: 72px; max-width: min(520px, calc(100vw - 210px)); background: rgba(8,36,64,.86); color: #fff;
    border-radius: 14px; padding: 10px 14px 12px; font-size: 15px; line-height: 1.35; }
  #tutor b { color: var(--chaleco); display: block; font-size: 12px; margin-bottom: 3px; letter-spacing: .04em; }
  #tareas { position: fixed; right: 12px; top: 60px; margin: 0; padding: 10px 14px 10px 30px; background: rgba(255,255,255,.9); color: var(--tinta);
    border-radius: 12px; font-size: 13px; max-width: 250px; }
  #tareas li { margin: 3px 0; } #tareas li.ok { color: #2e7d32; text-decoration: line-through; }
  #senas { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 14px;
    background: linear-gradient(rgba(8,36,64,0), rgba(8,36,64,.85)); }
  #senas button { flex: 0 0 auto; background: rgba(255,255,255,.94); color: var(--tinta); font-size: 13px; }
  #senas button:active { background: var(--chaleco); }
  #senas button.sugerida { background: var(--chaleco); font-weight: bold; box-shadow: 0 0 0 3px #fff; }
  #guia-fondo { position: fixed; right: 12px; bottom: 70px; width: min(170px, 30vw); aspect-ratio: 170 / 226; border: 3px solid var(--chaleco); border-radius: 6px; pointer-events: none; box-sizing: border-box; }
  #mi-sena { position: fixed; right: 12px; bottom: 300px; background: var(--chaleco); color: var(--tinta); font-weight: bold; font-size: 13px; padding: 5px 10px; border-radius: 10px; }
  #panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,36,64,.35); }
  #panel[hidden] { display: none; }
  #panel .caja { background: #fff; color: var(--tinta); border-radius: 18px; padding: 22px 24px; width: min(520px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  #panel h2 { margin: 0 0 10px; font-size: 22px; }
  #panel-texto { font-size: 15px; line-height: 1.45; max-height: 50vh; overflow: auto; }
  #nombre-cert { display: block; margin-top: 12px; font-size: 13px; color: #55606a; }
  #nombre-cert input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid #c5d0d8; border-radius: 8px; }
  #panel-botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  #panel-botones button { background: var(--tinta); color: #fff; font-weight: bold; }
  #panel-botones button.sec { background: #e3edf3; color: var(--tinta); font-weight: normal; }
  #pausa, #salida { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,36,64,.55); z-index: 4; }
  #salida { background: #082440; }
  #pausa .caja, #salida .caja { background: #fff; color: var(--tinta); border-radius: 18px; padding: 22px 24px; width: min(360px, calc(100vw - 32px)); text-align: center; }
  #pausa h2, #salida h2 { margin: 0 0 4px; } .sub { color: #55606a; font-size: 14px; margin-bottom: 14px; }
  #pausa-botones { display: flex; flex-direction: column; gap: 8px; }
  #pausa-botones button, #volver { background: var(--tinta); color: #fff; font-weight: bold; padding: 11px; }
  #pausa-botones button.sec { background: #e3edf3; color: var(--tinta); }
  #cargando { position: fixed; inset: 0; display: grid; place-items: center; background: #082440; color: #fff; font-size: 18px; z-index: 5; }
  #ayuda { position: fixed; left: 12px; top: 52px; color: var(--tinta); background: rgba(255,255,255,.7); padding: 3px 8px; border-radius: 8px; font-size: 11px; }
  @media (max-width: 640px) { #tareas { top: auto; bottom: 150px; font-size: 12px; max-width: 46vw; } #tutor { font-size: 13px; max-width: calc(100vw - 24px); bottom: 64px; } #cartel { top: 92px; font-size: 13px; } #mi-sena { bottom: 250px; } #ayuda { display: none; } }
</style>
</head>
<body>
<div id="lienzo"></div>
<div id="cargando">Cargando el AT-802…</div>
<div id="barra">
  <b>AURAV · Señaleros</b> <span id="fase"></span>
  <span class="sep"></span>
  <button id="cabina" class="chico" hidden>Ver desde la cabina</button>
  <button id="voz" class="chico">Voz: sí</button>
  <button id="menu" class="chico">Menú</button>
  <button id="entrar-vr" hidden>Entrar en VR</button>
</div>
<div id="ayuda">Arrastrá para mirar · WASD o tocá el piso para caminar · tocá los objetos · Esc: menú</div>
<div id="cartel" hidden></div>
<ul id="tareas" hidden></ul>
<div id="tutor" hidden><b>COMPAÑERO DE PUNTA DE ALA</b><span id="tutor-texto"></span></div>
<div id="guia-fondo" hidden></div><div id="mi-sena" hidden></div>
<div id="senas" hidden></div>
<div id="panel" hidden><div class="caja"><h2 id="panel-titulo"></h2><div id="panel-texto"></div><label id="nombre-cert" hidden>Nombre para el certificado<input id="nombre-input" maxlength="40" placeholder="Nombre y apellido"></label><div id="panel-botones"></div></div></div>
<div id="pausa" hidden><div class="caja"><h2>Pausa</h2><div class="sub">El juego está detenido.</div><div id="pausa-botones"></div></div></div>
<div id="salida" hidden><div class="caja"><h2>Saliste del juego</h2><div class="sub">Gracias por practicar. Ya podés cerrar esta pestaña.</div><button id="volver">Volver a entrar</button></div></div>
<script type="module" src="./main.js?v=20261008m"></script>
</body>
</html>
